name: Build DGW tools

on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: Rebuild Windows only (for platform-specific fixes)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tools:
    name: ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.windows_only && '[{"runner":"windows-2022","target":"windows-x86_64"}]' || '[{"runner":"ubuntu-22.04","target":"linux-x86_64"},{"runner":"ubuntu-24.04-arm","target":"linux-aarch64"},{"runner":"macos-14","target":"darwin-aarch64"},{"runner":"macos-15-intel","target":"darwin-x86_64"},{"runner":"windows-2022","target":"windows-x86_64"}]') }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: runner.os != 'Windows'
        with:
          python-version: '3.12'
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake
      - name: Windows build environment
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python
            mingw-w64-x86_64-libsystre
            mingw-w64-x86_64-pkgconf
      - name: Build and test Unix tools
        if: runner.os != 'Windows'
        shell: bash
        run: bash scripts/build.sh '${{ matrix.target }}'
      - name: Build and test Windows tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build.sh '${{ matrix.target }}'
      - name: Save diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            work/**/config.log
            work/**/config.mk
            work/zlib-build/Testing/Temporary/LastTest.log
            work/libdeflate-build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Save tested packages
        uses: actions/upload-artifact@v4
        with:
          name: dgw-tools-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
